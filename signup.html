<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up - Watch & Earn</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="navbar"><div class="brand">🎬 Watch & Earn</div></div>

  <div class="container">
    <div class="card">
      <h2>Naya Account</h2>
      <div id="err" class="error-msg" style="display:none;"></div>

      <label>Pura Naam</label>
      <input id="name" type="text" placeholder="Ali Khan" />

      <label>Email</label>
      <input id="email" type="email" placeholder="ali@example.com" />

      <label>Phone</label>
      <input id="phone" type="text" placeholder="03xx-xxxxxxx" />

      <label>Password</label>
      <input id="password" type="password" placeholder="Kam se kam 6 characters" />

      <button class="btn" onclick="doSignup()">Account Banayen</button>
      <p class="muted" style="text-align:center; margin-top:14px;">
        Pehle se account hai? <a class="link" href="login.html">Login karen</a>
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    async function doSignup() {
      const errBox = document.getElementById('err');
      errBox.style.display = 'none';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;

      if (!name || !email || !password) {
        errBox.textContent = 'Naam, email aur password zaroori hain';
        errBox.style.display = 'block';
        return;
      }

      try {
        const data = await api('/auth/signup', { method: 'POST', body: JSON.stringify({ name, email, phone, password }) });
        saveSession(data.token, data.user);
        window.location.href = 'dashboard.html';
      } catch (e) {
        errBox.textContent = e.message;
        errBox.style.display = 'block';
      }
    }
  </script>
</body>
</html>
