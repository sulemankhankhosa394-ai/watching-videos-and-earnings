<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login - Watch & Earn</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="navbar"><div class="brand">🎬 Watch & Earn</div></div>

  <div class="container">
    <div class="card">
      <h2>Login</h2>
      <div id="err" class="error-msg" style="display:none;"></div>

      <label>Email</label>
      <input id="email" type="email" placeholder="ali@example.com" />

      <label>Password</label>
      <input id="password" type="password" placeholder="Password" />

      <button class="btn" onclick="doLogin()">Login</button>
      <p class="muted" style="text-align:center; margin-top:14px;">
        Account nahi hai? <a class="link" href="signup.html">Sign up karen</a>
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    async function doLogin() {
      const errBox = document.getElementById('err');
      errBox.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const data = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
        saveSession(data.token, data.user);
        window.location.href = data.user.role === 'admin' ? 'admin.html' : 'dashboard.html';
      } catch (e) {
        errBox.textContent = e.message;
        errBox.style.display = 'block';
      }
    }
  </script>
</body>
</html>
